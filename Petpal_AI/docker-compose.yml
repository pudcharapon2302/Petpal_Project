services:
  # MySQL Database
  mysql_db:
    image: mysql:8.0
    container_name: mysql_server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # ChromaDB
  chroma_db:
    image: chromadb/chroma:1.0.21
    container_name: chromadb_server
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    networks:
      - app-network

  # Django Web
  web:
    build: .
    container_name: petpal_web
    working_dir: /app
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./data/staticfiles:/app/staticfiles
      - ./data/media:/app/media
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Docker network host names override values used when Django runs directly.
      - DB_HOST=mysql_db
      - CHROMA_HOST=chroma_db
      - CHROMA_PORT=8000
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    depends_on:
      - mysql_db
      - chroma_db
    networks:
      - app-network

volumes:
  db_data:
  huggingface_cache:

networks:
  app-network:
    driver: bridge
