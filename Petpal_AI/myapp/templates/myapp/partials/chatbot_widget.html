{% if request.user.is_authenticated %} <div x-data="chatApp()" class="z-[100]">

  <button @click="toggleChat()"
          class="fixed bottom-24 right-6 z-[100] flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-400 text-white shadow-2xl hover:scale-110 transition duration-300 group border-4 border-white">
    <span x-show="!isOpen">
       <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-9 h-9">
          <path d="M6 8L2 4v6c0 1 .5 2 1.5 2H6V8z" />
          <path d="M18 8l4-4v6c0 1-.5 2-1.5 2H18V8z" />
          <rect x="4" y="8" width="16" height="12" rx="4" ry="4" />
          <circle cx="9" cy="13" r="1.5" fill="white" />
          <circle cx="15" cy="13" r="1.5" fill="white" />
          <line x1="12" y1="8" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="2" r="1.5" fill="currentColor" />
       </svg>
    </span>
    <span x-show="isOpen" x-cloak>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </span>
  </button>

  <div x-show="isOpen" 
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-10 scale-95"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-10 scale-95"
       x-cloak
       class="fixed bottom-44 right-6 z-[100] w-80 md:w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col">
    
    <div class="bg-gradient-to-r from-orange-500 to-yellow-400 p-4 flex justify-between items-center text-white">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">🤖</div>
        <div>
          <h3 class="font-bold text-base">PetBot AI</h3>
          <p class="text-[10px] opacity-90">ถามได้ทุกเรื่องเกี่ยวกับสัตว์เลี้ยง</p>
        </div>
      </div>
      <a href="{% url 'ai_chat_page' %}" class="text-white/80 hover:text-white hover:bg-white/10 p-2 rounded-full transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
          <path fill-rule="evenodd" d="M4.25 2A2.25 2.25 0 002 4.25v2.5a.75.75 0 001.5 0v-2.5a.75.75 0 01.75-.75h2.5a.75.75 0 000-1.5h-2.5zM13.25 2a.75.75 0 000 1.5h2.5a.75.75 0 01.75.75v2.5a.75.75 0 001.5 0v-2.5A2.25 2.25 0 0015.75 2h-2.5zM2.75 13.25a.75.75 0 00-1.5 0v2.5A2.25 2.25 0 004.25 18h2.5a.75.75 0 000-1.5h-2.5a.75.75 0 01-.75-.75v-2.5zM17.25 13.25a.75.75 0 00-1.5 0v2.5a.75.75 0 01-.75.75h-2.5a.75.75 0 000 1.5h2.5A2.25 2.25 0 0018 15.75v-2.5z" clip-rule="evenodd" />
        </svg>
      </a>
    </div>

    <div class="flex-1 h-80 bg-orange-50 p-4 overflow-y-auto space-y-3" id="widget-chat-box">
    </div>

    <div class="p-3 bg-white border-t border-gray-100">
      <form class="flex gap-2" @submit.prevent="sendMessage">
        <input type="text" x-model="userInput" placeholder="พิมพ์คำถาม..." 
               class="flex-1 bg-gray-100 border-0 rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:bg-white transition text-gray-900 placeholder-gray-400">
        <button type="submit" :disabled="loading" class="bg-orange-500 text-white p-2 rounded-full hover:bg-orange-600 shadow-md transition disabled:opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
            <path d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" />
          </svg>
        </button>
      </form>
    </div>

  </div>
</div>

<script>
function chatApp() {
    return {
        isOpen: false,
        userInput: '',
        messages: [],
        loading: false,

        init() {
            // ✅ แก้ไขตรงนี้: เช็คว่าถ้าอยู่หน้า AI Chat เต็มจอ ให้ลบ Widget นี้ทิ้งเลย
            if (window.location.pathname.includes('/ai-chat/')) {
                this.$el.remove(); // ลบ Element ของ Widget ออกจากหน้าเว็บ
                return; // จบการทำงาน ไม่ต้องโหลดต่อ
            }

            // ถ้าไม่ใช่หน้า AI Chat ก็ทำงานตามปกติ
            this.renderMessages();
        },

        toggleChat() {
            this.isOpen = !this.isOpen;
            if (this.isOpen && this.messages.length === 0) {
                // ข้อความต้อนรับ
                this.messages.push({
                    role: 'ai',
                    text: 'สวัสดีครับ! 🐶 มีเรื่องสัตว์เลี้ยงให้ช่วยมั้ยครับ?'
                });
            }
        },

        async sendMessage() {
            if (!this.userInput.trim()) return;

            const text = this.userInput;
            this.userInput = '';
            this.messages.push({ role: 'user', text: text });
            this.loading = true;

            // Scroll ลงล่าง
            this.$nextTick(() => {
                const box = document.getElementById('widget-chat-box');
                if(box) box.scrollTop = box.scrollHeight;
            });

            try {
                const res = await fetch('/api/chat/?source=widget', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'same-origin', // ส่ง Cookie ไปด้วย
                    body: JSON.stringify({ message: text })
                });

                if (!res.ok) throw new Error('Network error');

                const data = await res.json();
                this.messages.push({ role: 'ai', text: data.response || 'ขออภัย ไม่เข้าใจคำถาม' });

            } catch (error) {
                console.error(error);
                this.messages.push({ role: 'ai', text: 'เกิดข้อผิดพลาด กรุณาลองใหม่' });
            } finally {
                this.loading = false;
                this.$nextTick(() => {
                    const box = document.getElementById('widget-chat-box');
                    if(box) box.scrollTop = box.scrollHeight;
                });
            }
        },

        renderMessages() {
            // ฟังก์ชันเดิมของคุณ (ถ้ามี logic โหลดข้อความเก่าก็ใส่ไว้ตรงนี้)
        }
    }
}
</script>

{% endif %}
