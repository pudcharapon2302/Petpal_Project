{% load static %}
{% load tailwind_tags %}
<!doctype html>
<html lang="th" x-data="{}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ลืมรหัสผ่าน • Petpal AI</title>
  {% tailwind_css %} 
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    html, body { font-family: "Noto Sans Thai", system-ui, sans-serif; height: 100%; margin: 0; }
    
    .card-container {
      max-width: 450px; width: 100%; background: #fff; padding: 40px;
      border-radius: 24px; position: relative; margin: 0 auto;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
    }
    .input-field {
        width: 100%; padding: 14px 15px; border: 2px solid #e5e7eb; border-radius: 12px;
        outline: none; font-size: 16px; transition: all 0.3s ease;
    }
    .input-field:focus { border-color: #ea580c; }
    
    .submit-btn {
      width: 100%; border: none; background: linear-gradient(45deg, #ea580c 0%, #f97316 100%);
      padding: 14px; border-radius: 12px; color: #fff; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: .3s ease; box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -5px rgba(234, 88, 12, 0.4); }
    
    .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); z-index: 0; }
  </style>
</head>
<body class="bg-neutral-900 text-neutral-900">
  {% include "myapp/partials/navbar.html" %}

  <div class="relative min-h-[calc(100vh-4rem)] flex items-center justify-center p-4">
    <img src="{% static 'images/login-bg.jpg' %}" alt="Background" class="bg-image">

    <div class="relative z-10 w-full flex justify-center">
      <form method="post" class="card-container">
        {% csrf_token %}
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-orange-600 mb-2">ลืมรหัสผ่าน?</h2>
            <p class="text-gray-500 text-sm">กรอกอีเมลที่คุณใช้สมัครสมาชิก <br>เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้ครับ</p>
        </div>

        <div class="mb-6">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2 pl-1">อีเมล</label>
          <input type="email" name="email" required placeholder="name@example.com" class="input-field">
        </div>

        <button type="submit" class="submit-btn">ส่งลิงก์รีเซ็ต</button>
        
        <div class="text-center mt-6">
            <a href="{% url 'login' %}" class="text-sm text-gray-500 hover:text-orange-600 font-medium transition">← กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
