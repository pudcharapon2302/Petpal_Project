{% load static %}
{% load tailwind_tags %}
<!doctype html>
<html lang="th" x-data="{}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ลืมรหัสผ่าน • Petpal AI</title>
  {% tailwind_css %} 
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>html,body{font-family:"Noto Sans Thai",system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}</style>
</head>
<body class="min-h-screen bg-neutral-900 text-neutral-900">

  {% include "myapp/partials/navbar.html" %}

  <div class="relative min-h-[calc(100vh-4rem)]">
    <img src="{% static 'images/login-bg.jpg' %}"
         alt="พื้นหลัง"
         class="absolute inset-0 w-full h-full object-cover" />
    <div class="absolute inset-0 bg-white/70"></div>

    <div class="relative mx-auto max-w-lg px-4 py-12 sm:py-16">

      <div class="w-full flex flex-col items-center mb-6">
        <img src="{% static 'images/logo.png' %}" alt="Petpal AI" class="h-24 w-24 mb-4">
        <h2 class="text-3xl font-bold text-gray-900">ลืมรหัสผ่าน? </h2>
        <p class="text-center text-gray-600 mt-2 text-sm">
            กรอกอีเมลที่คุณใช้สมัครสมาชิก<br>เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้ครับ
        </p>
      </div>

      <form method="post" class="space-y-6 bg-white/80 backdrop-blur-sm p-8 rounded-3xl shadow-xl ring-1 ring-black/5">
        {% csrf_token %}
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2 pl-1">อีเมล</label>
          <input type="email" name="email" required placeholder="name@example.com"
                 class="w-full rounded-full bg-white px-6 py-4 text-base shadow-sm ring-1 ring-black/10 focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <div class="pt-2 grid gap-4">
          <button type="submit" class="w-full rounded-full bg-neutral-900 px-6 py-3 text-white font-medium shadow hover:opacity-90 transition">
            ส่งลิงก์รีเซ็ต
          </button>
          <a href="{% url 'login' %}" class="w-full text-center rounded-full bg-white px-6 py-3 text-neutral-900 font-medium shadow ring-1 ring-black/10 hover:bg-neutral-50 transition">
            ยกเลิก / กลับไปหน้า Login
          </a>
        </div>
      </form>

    </div>
  </div>
</body>
</html>
