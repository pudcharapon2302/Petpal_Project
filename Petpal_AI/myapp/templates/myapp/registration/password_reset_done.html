{% load static %}
{% load tailwind_tags %}
<!doctype html>
<html lang="th" x-data="{}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตรวจสอบอีเมล • Petpal AI</title>
  {% tailwind_css %} 
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: "Noto Sans Thai", system-ui, sans-serif; height: 100%; margin: 0; }
    .card-container {
      max-width: 450px; width: 100%; background: #fff; padding: 50px 30px;
      border-radius: 24px; position: relative; margin: 0 auto; text-align: center;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
    }
    .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); z-index: 0; }
  </style>
</head>
<body class="bg-neutral-900 text-neutral-900">
  {% include "myapp/partials/navbar.html" %}

  <div class="relative min-h-[calc(100vh-4rem)] flex items-center justify-center p-4">
    <img src="{% static 'images/login-bg.jpg' %}" class="bg-image" />

    <div class="relative z-10 w-full flex justify-center">
      <div class="card-container">
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-green-100 mb-6">
            <svg class="h-10 w-10 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-900 mb-3">ตรวจสอบอีเมลของคุณ</h2>
        <p class="text-gray-600 mb-8 leading-relaxed">
           เราได้ส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปที่อีเมลของคุณแล้ว<br>
           กรุณาตรวจสอบกล่องจดหมาย (รวมถึง Junk/Spam)
        </p>
        
        <a href="{% url 'login' %}" class="inline-block px-8 py-3 rounded-full bg-gray-100 text-gray-700 font-bold hover:bg-gray-200 transition">
            กลับไปหน้าเข้าสู่ระบบ
        </a>
      </div>
    </div>
  </div>
</body>
</html>
