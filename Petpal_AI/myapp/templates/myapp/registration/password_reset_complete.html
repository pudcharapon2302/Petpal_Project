{% load static %}
{% load tailwind_tags %}
<!doctype html>
<html lang="th" x-data="{}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สำเร็จแล้ว • Petpal AI</title>
  {% tailwind_css %} 
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: "Noto Sans Thai", system-ui, sans-serif; height: 100%; margin: 0; }
    .card-container {
      max-width: 450px; width: 100%; background: #fff; padding: 50px 30px;
      border-radius: 24px; position: relative; margin: 0 auto; text-align: center;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
    }
    .submit-btn {
      display: inline-block; width: 100%; background: linear-gradient(45deg, #ea580c 0%, #f97316 100%);
      padding: 14px; border-radius: 12px; color: #fff; font-size: 16px; font-weight: bold;
      text-decoration: none; transition: .3s ease; box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -5px rgba(234, 88, 12, 0.4); }
    .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); z-index: 0; }
  </style>
</head>
<body class="bg-neutral-900 text-neutral-900">
  {% include "myapp/partials/navbar.html" %}

  <div class="relative min-h-[calc(100vh-4rem)] flex items-center justify-center p-4">
    <img src="{% static 'images/login-bg.jpg' %}" class="bg-image" />

    <div class="relative z-10 w-full flex justify-center">
      <div class="card-container">
        
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-orange-100 mb-6">
          <svg class="h-10 w-10 text-orange-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-900 mb-3">เปลี่ยนรหัสผ่านสำเร็จ!</h2>
        <p class="text-gray-600 mb-8">
            รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว <br>คุณสามารถใช้รหัสผ่านใหม่เพื่อเข้าสู่ระบบได้ทันที
        </p>
        
        <a href="{% url 'login' %}" class="submit-btn">
            เข้าสู่ระบบ
        </a>

      </div>
    </div>
  </div>
</body>
</html>
