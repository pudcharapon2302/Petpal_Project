{% load static %}
{% load tailwind_tags %}
<!doctype html>
<html lang="th" x-data="{}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สำเร็จแล้ว • Petpal AI</title>
  {% tailwind_css %} <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>html,body{font-family:"Noto Sans Thai",system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}</style>
</head>
<body class="min-h-screen bg-neutral-900 text-neutral-900">

  {% include "myapp/partials/navbar.html" %}

  <div class="relative min-h-[calc(100vh-4rem)]">
    <img src="{% static 'images/login-bg.jpg' %}" class="absolute inset-0 w-full h-full object-cover" />
    <div class="absolute inset-0 bg-white/70"></div>

    <div class="relative mx-auto max-w-lg px-4 py-12 sm:py-20 text-center">
      <div class="bg-white/90 backdrop-blur-sm p-10 rounded-3xl shadow-xl ring-1 ring-black/5">
        
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-green-100 mb-6">
          <svg class="h-10 w-10 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-900 mb-4">สำเร็จแล้ว! 🎉</h2>
        <p class="text-gray-600 mb-8 leading-relaxed">
            รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว<br>
            คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที
        </p>
        
        <a href="{% url 'login' %}" class="inline-block w-full rounded-full bg-neutral-900 px-6 py-3 text-white font-medium shadow hover:opacity-90 transition">
            เข้าสู่ระบบ
        </a>
      </div>
    </div>
  </div>
</body>
</html>
